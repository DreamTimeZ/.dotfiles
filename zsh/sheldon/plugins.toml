shell = "zsh"

[plugins]

[plugins.powerlevel10k]
github = "romkatv/powerlevel10k"
use = ["powerlevel10k.zsh-theme"]
apply = ["source"]

[plugins.mise]
local = "~/.dotfiles/zsh/sheldon"
use = ["mise.zsh"]
apply = ["source"]


[plugins.zoxide]
local = "~/.dotfiles/zsh/sheldon"
use = ["zoxide.zsh"]
apply = ["source"]

[plugins.terminal-title]
local = "~/.dotfiles/zsh/sheldon"
use = ["terminal-title.zsh"]
apply = ["source"]

[plugins.atuin]
local = "~/.dotfiles/zsh/sheldon"
use = ["atuin.zsh"]
apply = ["source"]

[plugins.fzf]
github = "junegunn/fzf"
dir = "shell"
use = ["completion.zsh"]

# fzf-tab must be loaded after compinit but before plugins that wrap widgets
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"
apply = ["source"]

[plugins.fzf-tab-config]
local = "~/.dotfiles/zsh/sheldon"
use = ["fzf-tab-config.zsh"]
apply = ["source"]
hooks.pre = '''
# Enable caching for better completion performance
zstyle ':completion:*' use-cache on
zstyle ':completion:*' cache-path "$HOME/.zcompcache"
# Ensure cache directory exists
mkdir -p -- "$HOME/.zcompcache"
'''

# z-sy-h after any plugin that adds buffer-modifying ZLE hooks

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["source"]

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["source"]

# Self-guards via TERM_PROGRAM check
[plugins.iterm]
local = "~/.dotfiles/zsh/sheldon"
use = ["iterm.zsh"]
apply = ["source"]

# SSH key lazy loading (agent started in .zprofile, keys loaded on first ssh/git use)
[plugins.ssh-keys]
local = "~/.dotfiles/zsh/sheldon"
use = ["ssh-keys.zsh"]
apply = ["source"]
