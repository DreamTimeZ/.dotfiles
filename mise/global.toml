min_version = "2026.3.0"

[tools]
python = "3.15"
node = "lts"
pnpm = "latest"
uv = "latest"
"npm:markdownlint-cli2" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python", "node"]

# uv owns .venv creation: source the .venv it created, never create one.
python.uv_venv_auto = "source"
